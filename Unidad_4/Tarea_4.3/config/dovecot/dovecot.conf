# =============================================================================
#  dovecot.conf - Dovecot 2.4, agente de entrega (MDA) y servidor IMAP
#  Tarea 4.3 · Ruta en el servidor: /etc/dovecot/dovecot.conf
#
#  - Recibe de Postfix por LMTP y guarda cada mensaje en el buzon (Maildir)
#  - Sirve los buzones por IMAPS (puerto 993, TLS obligatorio)
#  - Autentica a los usuarios para Postfix (SASL)
#  Este archivo reemplaza la configuracion de ejemplo de Ubuntu (conf.d/).
#  Sintaxis de Dovecot 2.4: distinta a la 2.3 de la mayoria de los tutoriales.
# =============================================================================

# Versiones de la sintaxis y del formato de almacenamiento (obligatorias en 2.4)
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

# Protocolos: IMAP para los clientes y LMTP para recibir de Postfix (sin POP3)
protocols = imap lmtp
listen = *

# --- Almacenamiento de los buzones ---
# Todos los buzones pertenecen al usuario de sistema "vmail" (uid 5000)
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
# Carpeta de cada usuario: /var/mail/vhosts/empresa.lan/<usuario>/Maildir
mail_home = /var/mail/vhosts/%{user | domain}/%{user | username}
mail_driver = maildir
mail_path = ~/Maildir

# Carpetas especiales que Thunderbird reconoce y se crean solas
namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
}

# --- Autenticacion ---
# Usuarios virtuales: usuario@empresa.lan y su contrasena cifrada (SHA512-CRYPT)
# en /etc/dovecot/usuarios. No son cuentas de Linux.
auth_mechanisms = plain login
# Nunca se acepta usuario y contrasena por una conexion sin cifrar
auth_allow_cleartext = no
auth_verbose = yes

passdb passwd-file {
  passwd_file_path = /etc/dovecot/usuarios
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/usuarios
}

# --- Cifrado TLS ---
ssl = required
ssl_server_cert_file = /etc/ssl/empresa/mail.crt
ssl_server_key_file = /etc/ssl/empresa/private/mail.key
ssl_min_protocol = TLSv1.2

# --- Servicios ---
# IMAP: se desactiva el 143 (texto plano) y solo queda IMAPS en el 993
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# LMTP: socket dentro de la cola de Postfix para recibir los mensajes
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

# SASL: Postfix pregunta aqui si el usuario y la contrasena son correctos
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# --- Registro: todo va a syslog (facilidad mail) -> /var/log/mail.log ---
log_path = syslog
syslog_facility = mail
