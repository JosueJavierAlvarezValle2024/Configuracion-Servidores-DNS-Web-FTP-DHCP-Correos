# =============================================================================
#  sshd-sftp.conf - SFTP enjaulado con OpenSSH (Tarea 4.2)
#  Ruta en el servidor: /etc/ssh/sshd_config.d/50-tarea42-sftp.conf
#
#  Los miembros del grupo sftpusuarios:
#    - solo pueden usar SFTP (no tienen terminal ni ejecutan comandos)
#    - quedan enjaulados en /srv/sftp/<usuario>
# =============================================================================

Match Group sftpusuarios
    # %u = nombre del usuario
    ChrootDirectory /srv/sftp/%u
    # SFTP interno de sshd; registra cada operacion
    ForceCommand internal-sftp -l INFO
    PasswordAuthentication yes
    # no puede usar el servidor como tunel
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no

# Fin del bloque Match: lo que siga en sshd_config vuelve a aplicar a todos
Match all
