# =============================================================================
#  vsftpd.conf - Servidor FTP seguro (FTPS) - Tarea 4.2
#  Ruta en el servidor: /etc/vsftpd.conf
#
#  - Sin acceso anonimo
#  - Solo usuarios locales que esten en /etc/vsftpd.userlist
#  - Cada usuario enjaulado (chroot) en /srv/sftp/<usuario>
#  - Inicio de sesion y datos cifrados obligatoriamente con TLS (FTPS)
# =============================================================================

# --- Modo de ejecucion: servicio independiente, solo IPv4 ---
listen=YES
listen_ipv6=NO

# --- Acceso ---
# SIN acceso anonimo
anonymous_enable=NO
# usuarios locales del sistema
local_enable=YES
# pueden subir, borrar y renombrar
write_enable=YES
# archivos subidos: 640, carpetas: 750
local_umask=027

# Lista blanca: solo los usuarios de este archivo pueden entrar
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Autenticacion PAM propia (igual a la de vsftpd pero sin pam_shells, porque
# los usuarios FTP tienen shell /usr/sbin/nologin y no pueden abrir terminal)
pam_service_name=vsftpd-tarea42

# --- Enjaulamiento (chroot jail) ---
# Al entrar, la raiz "/" del usuario es /srv/sftp/<usuario>: no puede subir
# a otras carpetas del servidor. La raiz pertenece a root y no tiene permiso
# de escritura (vsftpd lo exige); el usuario escribe dentro de "archivos".
chroot_local_user=YES
user_sub_token=$USER
local_root=/srv/sftp/$USER
# los listados muestran "ftp" en vez de usuarios reales
hide_ids=YES

# --- Cifrado TLS (FTPS explicito, AUTH TLS en el puerto 21) ---
ssl_enable=YES
rsa_cert_file=/etc/ssl/empresa/servidor.crt
rsa_private_key_file=/etc/ssl/empresa/private/servidor.key
allow_anon_ssl=NO
# la contrasena nunca viaja en texto plano
force_local_logins_ssl=YES
# los archivos tambien viajan cifrados
force_local_data_ssl=YES
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
# compatibilidad con clientes como FileZilla y curl
require_ssl_reuse=NO

# --- Modo pasivo: puertos para las transferencias de datos ---
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# --- Registro de actividad: inicios de sesion, subidas y descargas ---
xferlog_enable=YES
xferlog_std_format=NO
vsftpd_log_file=/var/log/vsftpd.log
log_ftp_protocol=YES

# --- Otros ---
utf8_filesystem=YES
dirmessage_enable=NO
use_localtime=YES
ftpd_banner=Servidor FTPS de empresa.lan - acceso solo para usuarios autorizados
secure_chroot_dir=/var/run/vsftpd/empty
