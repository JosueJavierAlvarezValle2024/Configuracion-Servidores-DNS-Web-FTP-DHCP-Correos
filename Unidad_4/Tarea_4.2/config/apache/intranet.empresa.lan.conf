# =============================================================================
#  intranet.empresa.lan.conf - Virtual Host de la intranet (Tarea 4.2)
#  Ruta en el servidor: /etc/apache2/sites-available/intranet.empresa.lan.conf
#  Se activa con: a2ensite intranet.empresa.lan
#
#  Mismo servidor y misma IP que www.empresa.lan: Apache distingue el sitio
#  por el nombre que pide el navegador (cabecera Host / SNI en HTTPS).
# =============================================================================

<VirtualHost *:80>
    ServerName intranet.empresa.lan
    RewriteEngine On
    RewriteRule ^ https://intranet.empresa.lan%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/intranet.empresa.lan-error.log
    CustomLog ${APACHE_LOG_DIR}/intranet.empresa.lan-acceso.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName intranet.empresa.lan
    ServerAdmin admin@empresa.lan
    DocumentRoot /var/www/empresa/intranet

    SSLEngine on
    SSLCertificateFile    /etc/ssl/empresa/servidor.crt
    SSLCertificateKeyFile /etc/ssl/empresa/private/servidor.key
    Header always set Strict-Transport-Security "max-age=31536000"

    <Directory /var/www/empresa/intranet>
        Options -Indexes
        AllowOverride None
        DirectoryIndex index.php
        # Solo la red interna y el propio servidor; el resto recibe 403
        Require ip 192.168.50.0/24 127.0.0.1
    </Directory>

    <FilesMatch "\.php$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/intranet.empresa.lan-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/intranet.empresa.lan-ssl-acceso.log combined
</VirtualHost>
