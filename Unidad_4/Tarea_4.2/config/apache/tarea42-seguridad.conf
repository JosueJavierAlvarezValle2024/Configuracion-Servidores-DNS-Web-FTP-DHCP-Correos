# =============================================================================
#  tarea42-seguridad.conf - Cifrado SSL/TLS y cabeceras de seguridad
#  Ruta en el servidor: /etc/apache2/conf-available/tarea42-seguridad.conf
#  Se activa con: a2enconf tarea42-seguridad  (aplica a todos los sitios)
# =============================================================================

# --- Protocolos: solo TLS 1.2 y TLS 1.3 (SSLv3, TLS 1.0 y 1.1 son inseguros) ---
SSLProtocol -all +TLSv1.2 +TLSv1.3

# --- Cifrados de TLS 1.2: solo intercambio ECDHE (secreto perfecto hacia
#     adelante) con AES-GCM o ChaCha20. TLS 1.3 usa siempre cifrados seguros.
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
# el cliente elige el mejor que soporte
SSLHonorCipherOrder off
SSLSessionTickets   off
# evita el ataque CRIME
SSLCompression      off

# Nombre global del servidor (evita el aviso AH00558 al arrancar)
ServerName srv01.empresa.lan

# --- No revelar version de Apache ni del sistema ---
# cabecera "Server: Apache" sin version
ServerTokens    Prod
# sin pie de pagina en paginas de error
ServerSignature Off
# desactiva el metodo HTTP TRACE
TraceEnable     Off

# --- Cabeceras de seguridad para todos los sitios ---
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # oculta la version de PHP
    Header always unset X-Powered-By
</IfModule>
