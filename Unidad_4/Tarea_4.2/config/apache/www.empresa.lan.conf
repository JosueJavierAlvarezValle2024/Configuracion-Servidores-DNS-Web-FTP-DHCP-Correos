# =============================================================================
#  www.empresa.lan.conf - Virtual Host del sitio publico (Tarea 4.2)
#  Ruta en el servidor: /etc/apache2/sites-available/www.empresa.lan.conf
#  Se activa con: a2ensite www.empresa.lan
# =============================================================================

# -----------------------------------------------------------------------------
# Puerto 80 (HTTP): todo se redirige a HTTPS.
# Unica excepcion: /ca.crt, el certificado de la autoridad certificadora local,
# para que los clientes lo descarguen y confien en el sitio.
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName  www.empresa.lan
    ServerAlias empresa.lan
    DocumentRoot /var/www/empresa/www

    Alias /ca.crt /var/www/empresa/ca/empresa-ca.crt
    <Directory /var/www/empresa/ca>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/ca\.crt$
    RewriteRule ^ https://www.empresa.lan%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/www.empresa.lan-error.log
    CustomLog ${APACHE_LOG_DIR}/www.empresa.lan-acceso.log combined
</VirtualHost>

# -----------------------------------------------------------------------------
# Puerto 443 (HTTPS)
# -----------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName  www.empresa.lan
    ServerAlias empresa.lan
    ServerAdmin admin@empresa.lan
    DocumentRoot /var/www/empresa/www

    # --- Cifrado SSL/TLS con el certificado de la CA local ---
    SSLEngine on
    SSLCertificateFile    /etc/ssl/empresa/servidor.crt
    SSLCertificateKeyFile /etc/ssl/empresa/private/servidor.key

    # HSTS: el navegador recordara usar siempre HTTPS con este sitio (1 año)
    Header always set Strict-Transport-Security "max-age=31536000"

    <Directory /var/www/empresa/www>
        # sin listado de carpetas
        Options -Indexes +FollowSymLinks
        # no se usan archivos .htaccess
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Las paginas PHP reciben los datos de la conexion TLS
    # (SSL_PROTOCOL, SSL_CIPHER...) para mostrarlos en la pagina de prueba
    <FilesMatch "\.php$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/www.empresa.lan-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/www.empresa.lan-ssl-acceso.log combined
</VirtualHost>
