// =============================================================================
//  named.conf - Archivo principal de BIND9 (Tarea 4.1)
//  Ruta en el servidor: /etc/bind/named.conf
//
//  En Ubuntu este archivo solo incluye otros tres; se deja como viene.
//  La configuracion de la tarea esta en:
//    named.conf.options  -> opciones globales, ACL, recursion y reenviadores
//    named.conf.local    -> declaracion de las zonas directa e inversa
// =============================================================================

include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.local";
include "/etc/bind/named.conf.default-zones";   // localhost, 127.in-addr.arpa, etc.
