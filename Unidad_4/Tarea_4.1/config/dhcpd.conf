# =============================================================================
#  dhcpd.conf - Servidor DHCP (ISC DHCP 4.4) - Tarea 4.1
#  Ruta en el servidor: /etc/dhcp/dhcpd.conf
#
#  Red: 192.168.50.0/24  (segmento "Sistemas y servidores" de empresa.lan)
#  Servidor DHCP/DNS/puerta de enlace: 192.168.50.10 (interfaz enp0s8)
#
#  Distribucion del segmento:
#    .1   - .19   IP fijas de servidores y equipos de red (fuera de DHCP)
#    .20  - .49   Reservas estaticas por MAC
#    .100 - .200  Rango dinamico, con EXCLUSION de .150 - .159
# =============================================================================

# Este servidor es la autoridad DHCP de la red: si un cliente pide una IP
# que no pertenece a esta subred, se le responde con DHCPNAK.
authoritative;

# Sin actualizacion dinamica de DNS: las zonas de BIND se mantienen a mano.
ddns-update-style none;

# --- Tiempos de concesion (lease time), en segundos ---
default-lease-time 3600;     # 1 hora, si el cliente no pide otro valor
max-lease-time     14400;    # 4 horas como maximo

# --- Opciones que reciben todos los clientes ---
option domain-name         "empresa.lan";
option domain-search       "empresa.lan";
option domain-name-servers 192.168.50.10;

# Los eventos DHCPDISCOVER / OFFER / REQUEST / ACK se registran en el journal
# (journalctl -u isc-dhcp-server).
log-facility local7;

# --- Declaracion de la subred ---
subnet 192.168.50.0 netmask 255.255.255.0 {
    option routers           192.168.50.10;     # el servidor hace NAT a internet
    option subnet-mask       255.255.255.0;
    option broadcast-address 192.168.50.255;

    # Rango dinamico .100 - .200 con EXCLUSION de .150 - .159.
    # ISC DHCP no tiene una directiva de exclusion: el rango se divide en dos
    # y las direcciones excluidas quedan fuera de ambos.
    range 192.168.50.100 192.168.50.149;
    range 192.168.50.160 192.168.50.200;
}

# --- Reservas estaticas por direccion MAC ---
# Una reserva entrega siempre la misma IP al equipo con esa MAC.
# La IP reservada debe estar FUERA del rango dinamico.
host cliente01 {
    hardware ethernet 08:00:27:81:8d:77;        # MAC de la VM cliente (Cliente-U4)
    fixed-address     192.168.50.20;
    option host-name  "cliente01";
}

host impresora01 {
    hardware ethernet 08:00:27:50:00:21;        # impresora de red (ejemplo)
    fixed-address     192.168.50.21;
    option host-name  "impresora01";
}
